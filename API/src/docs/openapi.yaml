openapi: 3.1.0
info:
  title: Evalytics Serverless Survey API
  version: 0.1.0
  description:
    "REST API for managing SurveyJS-based questionnaire templates, snapshots, campaigns, respondents, and responses,

    and for serving public survey endpoints to respondents.


    **Implementation Status: COMPLETED ✅**

    - All core endpoints implemented and tested (2026-01-03)

    - Local testing with SAM local fully functional

    - Known bugs fixed (header case-sensitivity, LIMIT/OFFSET parameters)

    - See API/TEST-REPORT.md for detailed test results


    **Placeholders (AWS Services Required)**

    - Email sending via SQS (POST /campaigns/:id/send) - returns 202 with note

    - S3 file uploads/downloads (POST /attachments/upload, GET /attachments/:id/download) - returns mock URLs

    - Email worker Lambda functions (worker.js, emailEvents.js) - stubs exist


    Audience

    - Admin UI (Svelte static web) for internal users

    - Public survey runtime for respondents


    Auth

    - Admin endpoints: JWT bearer token (1h expiry, recommended) and/or static API token per user (permanent, with scopes)

    - Public endpoints: respondent token provided in invitation link or campaign setup

    - **Note**: Header parsing is case-insensitive (X-Api-Token, X-API-Token, x-api-token all work)


    Notes

    - CORS origin allow-list helps browsers but is not a security control on its own.

    - All timestamps are ISO 8601 in UTC timezone.

    - Pagination: Use ?limit=N&offset=M query parameters (defaults: limit=50, offset=0)

    - All JSON fields in database (title, description, data, etc.) are automatically parsed/stringified

    "
  contact:
    name: Evalytics s.r.o.
    email: info@evalytics.cz
  license:
    name: Proprietary
servers:
  - url: http://127.0.0.1:3000
    description: Local (SAM)
  - url: https://api.evalytics.cz
    description: Production (planned)
  - url: https://{apiId}.execute-api.{region}.amazonaws.com/{stage}
    description: AWS API Gateway
    variables:
      apiId:
        default: xxxxxxxxxx
      region:
        default: eu-central-1
      stage:
        default: prod
        enum:
          - dev
          - test
          - prod
tags:
  - name: Auth
    description: Authentication and session management
  - name: Config
    description: Initial DB schema setup / migrations
  - name: Users
    description: User management (master-admin only)
  - name: Templates
    description: Survey template CRUD
  - name: Snapshots
    description: Template versions (recommended immutable once published)
  - name: Campaigns
    description: Publishing snapshots and sending emails
  - name: EmailAudit
    description: Delivery/bounce/complaint tracking for emails
  - name: Responses
    description: Collected responses and metadata
  - name: Public
    description: Endpoints used by respondents without admin login
  - name: Unsubscribe
    description: Email opt-out / blacklist
  - name: Storage
    description: File metadata + uploads (typically S3 presigned URLs)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin session JWT returned from POST /auth
    apiTokenAuth:
      type: apiKey
      in: header
      name: X-API-Token
      description: Static per-user API token for admin endpoints.
    respondentToken:
      type: apiKey
      in: header
      name: X-Respondent-Token
      description:
        "Respondent access token derived from invitation link (recommended: token delivered in URL fragment and
        then sent in this header)."
    respondentTokenQuery:
      type: apiKey
      in: query
      name: token
      description:
        (Deprecated) Respondent access token in query string for backward compatibility. Prefer X-Respondent-Token
        header.
      deprecated: true
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string
      required:
        - code
        - message
    Pagination:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
        offset:
          type: integer
          minimum: 0
          default: 0
        total:
          type: integer
          minimum: 0
    RoleSet:
      type: object
      additionalProperties: true
      description: 'JSON object for roles/permissions. Minimal: {"admin":1}.'
    User:
      type: object
      properties:
        user_id:
          type: string
          maxLength: 16
        firstname:
          type: string
          maxLength: 256
        lastname:
          type: string
          maxLength: 256
        email:
          type: string
          format: email
          maxLength: 256
        roles:
          $ref: "#/components/schemas/RoleSet"
        created:
          type: string
          format: date-time
        last_update:
          type: string
          format: date-time
      required:
        - user_id
        - firstname
        - lastname
        - email
        - roles
        - created
        - last_update
    UserUpsert:
      type: object
      properties:
        user_id:
          type: string
          maxLength: 16
          description: If omitted, server generates.
        firstname:
          type: string
          maxLength: 256
        lastname:
          type: string
          maxLength: 256
        email:
          type: string
          format: email
          maxLength: 256
        password:
          type: string
          format: password
          description: Plaintext over TLS; stored hashed.
        roles:
          $ref: "#/components/schemas/RoleSet"
        rotate_api_token:
          type: boolean
          default: false
      required:
        - firstname
        - lastname
        - email
        - roles
    TemplateCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 256
        surveyjs_version:
          type: string
          maxLength: 16
        surveyjs_template:
          type: string
          maxLength: 64
        languages:
          type: array
          items:
            type: string
        data:
          type: object
          additionalProperties: true
          description: SurveyJS JSON definition.
      required:
        - name
        - surveyjs_version
        - languages
        - data
    Template:
      description: Complete template with full SurveyJS data. Note - user names (firstname/lastname) are not included; only user_id references.
      allOf:
        - $ref: "#/components/schemas/TemplateCreate"
        - type: object
          properties:
            template_id:
              type: string
              maxLength: 16
            created:
              type: string
              format: date-time
            last_update:
              type: string
              format: date-time
            created_by:
              type: string
              maxLength: 16
              description: User ID who created the template
            last_modified_by:
              type: string
              maxLength: 16
              description: User ID who last modified the template
          required:
            - template_id
            - created
            - last_update
            - created_by
            - last_modified_by
    TemplateListItem:
      type: object
      description: Template list item without the full SurveyJS data payload
      properties:
        template_id:
          type: string
          maxLength: 16
        name:
          type: string
          maxLength: 256
        surveyjs_version:
          type: string
          maxLength: 16
        languages:
          type: array
          items:
            type: string
        created:
          type: string
          format: date-time
        last_update:
          type: string
          format: date-time
        created_by:
          type: string
          maxLength: 16
          description: User ID who created the template
        last_modified_by:
          type: string
          maxLength: 16
          description: User ID who last modified the template
      required:
        - template_id
        - name
        - surveyjs_version
        - languages
        - created
        - last_update
        - created_by
        - last_modified_by
    SnapshotCreate:
      type: object
      properties:
        template_id:
          type: string
          maxLength: 16
        note:
          type: string
        lock:
          type: boolean
          default: true
      required:
        - template_id
    Snapshot:
      type: object
      description: "Complete snapshot with full SurveyJS data. Note - user names (firstname/lastname) are not included; only user_id references."
      properties:
        snapshot_id:
          type: string
          maxLength: 16
        template_id:
          type: string
          maxLength: 16
        template_name:
          type: string
          description: Name of the source template
        version:
          type: integer
          minimum: 1
          description: Snapshot version number (auto-incremented per template)
        surveyjs_version:
          type: string
          maxLength: 16
        surveyjs_template:
          type: string
          maxLength: 64
        languages:
          type: array
          items:
            type: string
        data:
          type: object
          additionalProperties: true
          description: Full SurveyJS configuration JSON
        note:
          type: string
          description: Optional note about this snapshot version
        locked:
          type: boolean
          default: true
          description: If true, snapshot cannot be modified
        created:
          type: string
          format: date-time
        last_update:
          type: string
          format: date-time
        created_by:
          type: string
          maxLength: 16
          description: User ID who created the snapshot
        last_modified_by:
          type: string
          maxLength: 16
          description: User ID who last modified the snapshot
      required:
        - snapshot_id
        - template_id
        - version
        - surveyjs_version
        - languages
        - data
        - created
        - last_update
        - created_by
        - last_modified_by
    SnapshotListItem:
      type: object
      description: "Snapshot list item without the full SurveyJS data payload (similar to templates). Use GET /snapshots/{id} to retrieve full data."
      properties:
        snapshot_id:
          type: string
          maxLength: 16
        template_id:
          type: string
          maxLength: 16
        template_name:
          type: string
          description: Name of the source template
        version:
          type: integer
          minimum: 1
          description: Snapshot version number
        surveyjs_version:
          type: string
          description: SurveyJS library version
        surveyjs_template:
          type: string
          description: SurveyJS theme/template name
        languages:
          type: array
          items:
            type: string
          description: Supported language codes
        note:
          type: string
          description: Optional note about this snapshot
        locked:
          type: boolean
          description: If true, snapshot cannot be modified
        created:
          type: string
          format: date-time
        last_update:
          type: string
          format: date-time
        created_by:
          type: string
          description: User ID who created the snapshot
        last_modified_by:
          type: string
          description: User ID who last modified the snapshot
      required:
        - snapshot_id
        - template_id
        - version
        - languages
        - last_update
    CampaignCreate:
      type: object
      properties:
        snapshot_id:
          type: string
          maxLength: 16
        public_id:
          type: string
          maxLength: 256
          description: If omitted, server may generate.
        title:
          type: object
          additionalProperties:
            type: string
        description:
          type: object
          additionalProperties:
            type: string
        email_template:
          type: object
          additionalProperties: true
        open_on:
          type:
            - string
            - "null"
          format: date-time
        close_on:
          type:
            - string
            - "null"
          format: date-time
        allow_multiple_responses:
          type: boolean
          default: false
          description: If true, a single respondent can create multiple response attempts in the same campaign.
        max_attempts:
          type:
            - integer
            - "null"
          minimum: 1
          default: 1
          description: Maximum number of attempts per respondent. Null means unlimited (not recommended without safeguards).
        retention:
          $ref: "#/components/schemas/RetentionPolicy"
      required:
        - snapshot_id
        - title
        - description
        - email_template
    Campaign:
      allOf:
        - $ref: "#/components/schemas/CampaignCreate"
        - type: object
          properties:
            campaign_id:
              type: string
              maxLength: 16
            created:
              type: string
              format: date-time
            last_update:
              type: string
              format: date-time
            created_by:
              type: string
              maxLength: 16
            last_modified_by:
              type: string
              maxLength: 16
          required:
            - campaign_id
            - created
            - last_update
            - created_by
            - last_modified_by
    CampaignListItem:
      type: object
      properties:
        campaign_id:
          type: string
        public_id:
          type: string
        snapshot_id:
          type: string
        open_on:
          type:
            - string
            - "null"
          format: date-time
        close_on:
          type:
            - string
            - "null"
          format: date-time
        stats:
          type: object
          properties:
            respondents_total:
              type: integer
              minimum: 0
            responses_total:
              type: integer
              minimum: 0
            responses_completed:
              type: integer
              minimum: 0
            responses_partial:
              type: integer
              minimum: 0
          additionalProperties: false
        last_update:
          type: string
          format: date-time
      required:
        - campaign_id
        - public_id
        - snapshot_id
        - stats
        - last_update
    Respondent:
      type: object
      properties:
        respondent_id:
          type: string
          maxLength: 32
        campaign_id:
          type: string
          maxLength: 16
        email:
          type: string
          format: email
          maxLength: 256
        token:
          type: string
          maxLength: 128
          description: Recommended to store hashed token server-side.
        data:
          type: object
          additionalProperties: true
        created:
          type: string
          format: date-time
        last_update:
          type: string
          format: date-time
      required:
        - respondent_id
        - campaign_id
        - email
        - created
        - last_update
    Response:
      type: object
      properties:
        response_id:
          type: string
          maxLength: 64
        respondent_id:
          type: string
          maxLength: 32
        request_data:
          type: object
          additionalProperties: true
        data:
          type: object
          additionalProperties: true
        is_complete:
          type: boolean
          deprecated: true
          description: "Deprecated: use status='completed'."
        created:
          type: string
          format: date-time
        last_update:
          type: string
          format: date-time
        campaign_id:
          type: string
          maxLength: 16
          description: Convenience denormalization.
        snapshot_id:
          type: string
          maxLength: 16
          description: Convenience denormalization.
        attempt_no:
          type: integer
          minimum: 1
          description: Attempt number for a given respondent within a campaign.
        status:
          $ref: "#/components/schemas/ResponseStatus"
        client_meta:
          type: object
          additionalProperties: true
          description: Optional client telemetry (time spent, device hints, etc.).
        submitted_at:
          type:
            - string
            - "null"
          format: date-time
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/ResponseAttachment"
      required:
        - data
        - status
        - last_update
        - created
        - response_id
        - respondent_id
        - attempt_no
    ResponseUpsert:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
        is_complete:
          type: boolean
          deprecated: true
          description: "Deprecated: use status='completed'."
        client_meta:
          type: object
          additionalProperties: true
        response_id:
          type: string
          maxLength: 64
          description:
            If provided, updates this specific attempt. If omitted, server updates latest open attempt (or creates
            attempt 1).
        status:
          $ref: "#/components/schemas/ResponseStatus"
      required:
        - data
    AuthRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - email
        - password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - expires_in
        - user
    ApiToken:
      type: object
      description:
        "Long-lived personal access token (PAT) for programmatic REST access. The plaintext token value is only
        shown once on creation; only hashes are stored.

        "
      properties:
        token_id:
          type: string
          maxLength: 32
        user_id:
          type: string
          maxLength: 16
        name:
          type: string
          maxLength: 128
        scopes:
          type: array
          items:
            type: string
        created:
          type: string
          format: date-time
        last_used:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
      required:
        - token_id
        - user_id
        - name
        - scopes
        - created
    ApiTokenCreateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
        scopes:
          type: array
          items:
            type: string
          default: []
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
        - name
    ApiTokenCreateResponse:
      type: object
      properties:
        token:
          type: string
          description: Plaintext token value (returned only once).
        api_token:
          $ref: "#/components/schemas/ApiToken"
      required:
        - token
        - api_token
    ApiTokenList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"
      required:
        - items
    ConfigRequest:
      type: object
      properties:
        reset:
          type: boolean
          default: false
        schema:
          type: string
      required:
        - schema
    ConfigResponse:
      type: object
      properties:
        ok:
          type: boolean
        log:
          type: array
          items:
            type: string
      required:
        - ok
        - log
    EmailSendRequest:
      type: object
      properties:
        mode:
          type: string
          enum:
            - initial
            - reminder
          default: initial
        dry_run:
          type: boolean
          default: false
        only_unsent:
          type: boolean
          default: true
        limit:
          type: integer
          minimum: 1
          maximum: 5000
        locale_fallback:
          type: string
          default: en-GB
        reminder_targets:
          type: string
          enum:
            - not_started
            - incomplete
            - both
          default: both
          description: "For reminder mode: choose which respondents to target."
        incomplete_grace_minutes:
          type: integer
          minimum: 0
          default: 60
          description: "For reminder mode + incomplete targets: do not remind if respondent was active within this many minutes."
      additionalProperties: false
    EmailSendStatus:
      type: object
      properties:
        campaign_id:
          type: string
        mode:
          type: string
          enum:
            - initial
            - reminder
        counts:
          type: object
          properties:
            queued:
              type: integer
              minimum: 0
            sent:
              type: integer
              minimum: 0
            bounced:
              type: integer
              minimum: 0
            complained:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
          additionalProperties: false
        last_update:
          type: string
          format: date-time
      required:
        - campaign_id
        - mode
        - counts
        - last_update
    EmailLogEntry:
      type: object
      description: Per-recipient email send record with delivery audit fields.
      properties:
        email_log_id:
          type: integer
          format: int64
        campaign_id:
          type: string
          maxLength: 16
        respondent_id:
          type: string
          maxLength: 32
        recipient_email:
          type: string
          format: email
        email_type:
          type: string
          enum: [invite, reminder]
        provider:
          type: string
          enum: [ses]
        provider_message_id:
          type:
            - string
            - "null"
        status:
          type: string
          enum: [queued, sent, delivered, bounced, complaint, rejected, failed]
        last_event_type:
          type:
            - string
            - "null"
        last_event_at:
          type:
            - string
            - "null"
          format: date-time
        error_message:
          type:
            - string
            - "null"
        created:
          type: string
          format: date-time
        last_update:
          type: string
          format: date-time
      required:
        - email_log_id
        - campaign_id
        - respondent_id
        - recipient_email
        - email_type
        - provider
        - status
        - created
        - last_update
      additionalProperties: false
    EmailLogList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmailLogEntry"
        page:
          $ref: "#/components/schemas/Pagination"
      required: [items, page]
      additionalProperties: false
    EmailDeliveryEvent:
      type: object
      description: Provider delivery event (raw-ish) stored for audit.
      properties:
        event_id:
          type: integer
          format: int64
        provider:
          type: string
          enum: [ses]
        provider_message_id:
          type: string
        event_type:
          type: string
        event_at:
          type: string
          format: date-time
        recipient_email:
          type:
            - string
            - "null"
          format: email
        payload_json:
          type:
            - object
            - "null"
          additionalProperties: true
      required:
        - event_id
        - provider
        - provider_message_id
        - event_type
        - event_at
      additionalProperties: false
    EmailDeliveryEventList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmailDeliveryEvent"
        page:
          $ref: "#/components/schemas/Pagination"
      required: [items, page]
      additionalProperties: false

    SurveyPublic:
      type: object
      properties:
        public_id:
          type: string
        snapshot:
          $ref: "#/components/schemas/Snapshot"
        campaign:
          $ref: "#/components/schemas/Campaign"
        response:
          oneOf:
            - $ref: "#/components/schemas/ResponsePublic"
            - type: "null"
        locale:
          type: string
        responses:
          type: array
          items:
            $ref: "#/components/schemas/ResponsePublic"
          description: "Optional: all attempts (if requested)."
      required:
        - public_id
        - snapshot
        - campaign
    UnsubscribeTokenRequest:
      type: object
      description: Unsubscribe action invoked from email footer. Uses a signed token so the API never needs to accept raw email in query params.
      properties:
        u:
          type: string
          description: Signed unsubscribe token from email footer.
        reason:
          type:
            - string
            - "null"
          maxLength: 256
      required: [u]
      additionalProperties: false
    UnsubscribeResponse:
      type: object
      properties:
        ok:
          type: boolean
        scope:
          type: string
          enum: [snapshot, global]
          description: snapshot = stop emails only for this research/snapshot; global = stop all emails from the platform.
        snapshot_id:
          type:
            - string
            - "null"
          maxLength: 16
        message:
          type: string
      required:
        - ok
        - scope
        - message
      additionalProperties: false
    RespondentUpsert:
      type: object
      properties:
        respondent_id:
          type: string
          maxLength: 32
          description: If omitted, server generates.
        email:
          type: string
          format: email
          maxLength: 256
        data:
          type: object
          additionalProperties: true
        regenerate_token:
          type: boolean
          default: false
      required:
        - email
    BulkResult:
      type: object
      properties:
        ok:
          type: boolean
        created:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        deleted:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Error"
      required:
        - ok
    BlacklistEntry:
      type: object
      properties:
        black_list_id:
          type: integer
        email:
          type: string
          format: email
          maxLength: 256
        scope:
          type: string
          enum: [snapshot, global]
        snapshot_id:
          type:
            - string
            - "null"
          maxLength: 16
          description: Required when scope=snapshot. Must be null when scope=global.
        reason_code:
          type: integer
          description: Enumerated reason code.
        note:
          type:
            - string
            - "null"
        created:
          type: string
          format: date-time
      required:
        - black_list_id
        - email
        - scope
        - created
      additionalProperties: false
    BlacklistUpsert:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 256
        scope:
          type: string
          enum: [snapshot, global]
          default: snapshot
        snapshot_id:
          type:
            - string
            - "null"
          maxLength: 16
        reason_code:
          type: integer
        note:
          type: string
          maxLength: 512
      required:
        - email
        - scope
      additionalProperties: false
    StorageItem:
      type: object
      properties:
        storage_item_id:
          type: string
          maxLength: 32
        location:
          type: string
          description: S3 URI or other remote location.
        local_path:
          type: string
          description: Logical folder path used in UI.
        name:
          type: string
          maxLength: 256
        description:
          type: string
        filetype:
          type: string
          maxLength: 256
        size_bytes:
          type: integer
          minimum: 0
        created:
          type: string
          format: date-time
        last_update:
          type: string
          format: date-time
        created_by:
          type: string
          maxLength: 16
        last_modified_by:
          type: string
          maxLength: 16
      required:
        - storage_item_id
        - name
        - created
        - last_update
    StorageCreateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 256
        filetype:
          type: string
          maxLength: 256
          description: MIME type (recommended)
        local_path:
          type: string
        description:
          type: string
        size_bytes:
          type: integer
          minimum: 0
      required:
        - name
        - filetype
    PresignedUpload:
      type: object
      properties:
        storage_item:
          $ref: "#/components/schemas/StorageItem"
        upload:
          type: object
          properties:
            method:
              type: string
              enum:
                - PUT
                - POST
            url:
              type: string
            headers:
              type: object
              additionalProperties:
                type: string
            fields:
              type: object
              additionalProperties:
                type: string
            expires_in:
              type: integer
          required:
            - method
            - url
            - expires_in
      required:
        - storage_item
        - upload
    ResponseStatus:
      type: string
      description: Logical status of a response attempt.
      enum:
        - in_progress
        - completed
    RetentionPolicy:
      type: object
      description:
        "Retention policy for personal data. NOTE: GDPR does not define a fixed maximum retention period; controller
        must define limits based on necessity/proportionality and/or legal obligations."
      properties:
        identifiable_retention_days:
          type:
            - integer
            - "null"
          minimum: 1
          description:
            How long responses may be stored in an identifiable form (email/token-hash linkable to a person). Null
            disables auto-expiry (not recommended unless data are anonymised).
        after_retention_action:
          type: string
          enum:
            - delete
            - anonymize
          default: anonymize
          description:
            "What to do after identifiable_retention_days: delete all data or anonymize (remove identifiers, keep
            aggregated/anonymous answers)."
        review_every_days:
          type: integer
          minimum: 1
          default: 365
          description: Periodic review cadence for retention necessity.
        legal_hold:
          type: boolean
          default: false
          description: If true, automated deletion/anonymisation is paused for this campaign.
      additionalProperties: false
    ResponseAttachment:
      type: object
      properties:
        upload_id:
          type: string
          maxLength: 64
          description: Upload session ID.
        storage_item_id:
          type: string
          maxLength: 16
        question_name:
          type: string
          maxLength: 256
          description: SurveyJS question name / field that owns this file.
        original_name:
          type: string
          maxLength: 512
        content_type:
          type: string
          maxLength: 128
          description: "Allowed categories: images (image/*), documents (pdf/doc/docx/xls/xlsx/ppt/pptx/txt), audio (audio/*), video (video/*)."
        size_bytes:
          type: integer
          minimum: 0
        created:
          type: string
          format: date-time
      required:
        - upload_id
        - storage_item_id
        - question_name
        - original_name
        - created
      additionalProperties: false
    ResponsePublic:
      type: object
      properties:
        response_id:
          type: string
          maxLength: 64
        attempt_no:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/ResponseStatus"
        data:
          type: object
          additionalProperties: true
        submitted_at:
          type:
            - string
            - "null"
          format: date-time
        created:
          type: string
          format: date-time
        last_update:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/ResponseAttachment"
      required:
        - response_id
        - attempt_no
        - status
        - data
        - created
        - last_update
      additionalProperties: false
    PublicUploadInitRequest:
      type: object
      properties:
        response_id:
          type: string
          maxLength: 64
          description: Target response attempt. If omitted, server uses latest open attempt (or creates attempt 1).
        question_name:
          type: string
          maxLength: 256
        original_name:
          type: string
          maxLength: 512
        content_type:
          type: string
          maxLength: 128
        size_bytes:
          type: integer
          minimum: 1
          maximum: 52428800
          description: Maximum 50 MB per file.
        checksum_sha256:
          type:
            - string
            - "null"
          maxLength: 128
          description: Optional checksum to validate upload.
      required:
        - question_name
        - original_name
        - content_type
        - size_bytes
      additionalProperties: false
    PublicUploadInitResponse:
      type: object
      properties:
        upload_id:
          type: string
          maxLength: 64
        response_id:
          type: string
          maxLength: 64
        storage_item_id:
          type: string
          maxLength: 16
        upload:
          $ref: "#/components/schemas/PresignedUpload"
        expires_at:
          type: string
          format: date-time
        max_size_bytes:
          type: integer
          minimum: 1
      required:
        - upload_id
        - response_id
        - storage_item_id
        - upload
        - expires_at
        - max_size_bytes
      additionalProperties: false
    PublicUploadCompleteRequest:
      type: object
      properties:
        etag:
          type:
            - string
            - "null"
          description: Optional ETag returned by S3.
      additionalProperties: false
    PublicUploadCompleteResponse:
      type: object
      properties:
        ok:
          type: boolean
        attachment:
          $ref: "#/components/schemas/ResponseAttachment"
      required:
        - ok
        - attachment
      additionalProperties: false
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
      description: Page size
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Page offset
    TemplateIdQuery:
      name: template_id
      in: query
      required: false
      schema:
        type: string
        maxLength: 16
      description: Filter by template_id
    CampaignIdQuery:
      name: campaign_id
      in: query
      required: false
      schema:
        type: string
        maxLength: 16
      description: Filter by campaign_id
    SnapshotIdQuery:
      name: snapshot_id
      in: query
      required: false
      schema:
        type: string
        maxLength: 16
      description: Filter by snapshot_id
    RespondentIdQuery:
      name: respondent_id
      in: query
      required: false
      schema:
        type: string
        maxLength: 32
      description: Filter by respondent_id
    IdPath16:
      name: id
      in: path
      required: true
      schema:
        type: string
        maxLength: 16
      description: Entity identifier
    PublicIdPath:
      name: public_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 256
      description: Public campaign id
    TokenQuery:
      name: token
      in: query
      required: true
      schema:
        type: string
        maxLength: 128
      description: Respondent token
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
security:
  - bearerAuth: []
  - apiTokenAuth: []
paths:
  /auth:
    post:
      tags:
        - Auth
      summary: Authenticate admin user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current admin session
      description: Returns the user associated with the provided bearer JWT or X-API-Token.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /api-tokens:
    get:
      tags:
        - Auth
      summary: List personal access tokens
      description: Lists PAT metadata for the authenticated user. Does not return token value.
      responses:
        "200":
          description: Token list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Auth
      summary: Create personal access token
      description: Creates a new PAT for programmatic REST access. The plaintext token is returned only once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /api-tokens/{token_id}:
    delete:
      tags:
        - Auth
      summary: Revoke personal access token
      parameters:
        - name: token_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 32
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /config:
    post:
      tags:
        - Config
      summary: Initialize or migrate database schema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigRequest"
      responses:
        "200":
          description: Migration result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /users:
    get:
      tags:
        - Users
      summary: Get user
      description: Master-admin only. Fetch a user by user_id or email.
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 16
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Users
      summary: Create or update user
      description: Master-admin only. Upserts a user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpsert"
      responses:
        "200":
          description: Upserted user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags:
        - Users
      summary: Delete user
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            maxLength: 16
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /templates:

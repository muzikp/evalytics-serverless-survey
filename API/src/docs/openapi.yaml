        - $ref: "#/components/parameters/Offset"
        - name: id
          in: query
          required: false
          schema:
            type: string
            maxLength: 16
          description: Filter by exact template_id
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search by name (substring)
        - name: surveyjs_version
          in: query
          required: false
          schema:
            type: string
          description: Filter by exact SurveyJS version
        - name: languages
          in: query
          required: false
          schema:
            type: string
          description: Filter templates containing this language code (e.g., "en", "cs")
        - name: created_by
          in: query
          required: false
          schema:
            type: string
            maxLength: 16
          description: Filter by user_id who created the template
        - name: last_modified_by
          in: query
          required: false
          schema:
            type: string
            maxLength: 16
          description: Filter by user_id who last modified the template
        - name: created_from
          in: query
          required: false
